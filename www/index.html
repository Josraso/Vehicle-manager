<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d6efd">
    <title>Vehicle Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(150deg, #0d6efd 0%, #0a4fbd 100%);
            padding: 24px;
            padding-top: env(safe-area-inset-top, 24px);
            padding-bottom: env(safe-area-inset-bottom, 24px);
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 28px 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.22);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 6px;
        }
        .logo svg { width: 60px; height: 60px; }

        h1 {
            text-align: center;
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* Formulario */
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        input[type="url"] {
            width: 100%;
            padding: 13px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: #1e293b;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            transition: border-color 0.2s;
        }
        input[type="url"]:focus { border-color: #0d6efd; }
        input[type="url"]::placeholder { color: #94a3b8; }

        .hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 7px;
            line-height: 1.4;
        }

        /* Mensajes */
        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 14px;
            display: none;
            line-height: 1.4;
        }
        .error.show { display: block; }

        .loading {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-top: 14px;
            display: none;
        }
        .loading.show { display: block; }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #e2e8f0;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: spin 0.55s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Botones */
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s;
        }
        .btn-primary { background: #0d6efd; color: #fff; margin-top: 22px; }
        .btn-primary:active { background: #0b5ed7; }

        .btn-reset {
            background: transparent;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            margin-top: 10px;
            padding: 8px;
            display: none;
        }
        .btn-reset:active { color: #0d6efd; }
    </style>
</head>
<body>
<div class="card">
    <!-- Icono coche -->
    <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z" fill="#0d6efd"/>
        </svg>
    </div>

    <h1>Vehicle Manager</h1>
    <p class="subtitle">Conecta con tu servidor</p>

    <label for="urlInput">Dirección del servidor</label>
    <input type="url" id="urlInput"
           placeholder="ej: http://192.168.1.10"
           autocomplete="off"
           oninput="hideError()"
           onkeydown="if(event.key==='Enter') connect()">
    <p class="hint">Es la misma dirección que usas cuando accedes desde el ordenador en el navegador.</p>

    <div class="error" id="errorMsg"></div>
    <div class="loading" id="loadingMsg"><span class="spinner"></span>Conectando...</div>

    <button class="btn btn-primary" onclick="connect()">Conectar</button>
    <button class="btn btn-reset" id="resetBtn" onclick="resetUrl()">Cambiar servidor</button>
</div>

<script>
(function () {
    const urlInput   = document.getElementById('urlInput');
    const errorMsg   = document.getElementById('errorMsg');
    const loadingMsg = document.getElementById('loadingMsg');
    const resetBtn   = document.getElementById('resetBtn');

    const savedUrl = localStorage.getItem('vm_server_url');

    // Si ya hay URL guardada intentar conectar automáticamente
    if (savedUrl) {
        urlInput.value = savedUrl;
        resetBtn.style.display = 'block';
        autoConnect(savedUrl);
    }

    // ---------- auto-connect (al arrancar con URL guardada) ----------
    async function autoConnect(url) {
        showLoading(true);
        try {
            await fetch(url, { mode: 'no-cors', signal: AbortSignal.timeout(4000) });
            window.location.replace(url);          // reachable → go
        } catch {
            showLoading(false);
            showError('No se pudo conectar al servidor guardado. Comprueba que esté encendido o edita la dirección.');
        }
    }

    // ---------- botón Conectar ----------
    async function connect() {
        let url = urlInput.value.trim();
        if (!url) { showError('Introduce la dirección del servidor.'); return; }

        // Normalizar
        if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'http://' + url;
        if (!url.endsWith('/')) url += '/';

        hideError();
        showLoading(true);

        try {
            await fetch(url, { mode: 'no-cors', signal: AbortSignal.timeout(5000) });
            localStorage.setItem('vm_server_url', url);
            window.location.replace(url);
        } catch {
            showLoading(false);
            showError('No se puede conectar. Comprueba que el servidor esté encendido y la dirección es correcta.');
        }
    }

    // ---------- resetear URL ----------
    function resetUrl() {
        localStorage.removeItem('vm_server_url');
        urlInput.value = '';
        hideError();
        showLoading(false);
        resetBtn.style.display = 'none';
    }

    // ---------- helpers ----------
    function showError(msg)  { errorMsg.textContent = msg; errorMsg.classList.add('show'); }
    function hideError()     { errorMsg.classList.remove('show'); }
    function showLoading(on) { loadingMsg.classList.toggle('show', on); }

    // Exponer al scope global para los onclick del HTML
    window.connect   = connect;
    window.resetUrl  = resetUrl;
    window.hideError = hideError;
})();
</script>
</body>
</html>
